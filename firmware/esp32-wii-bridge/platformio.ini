[platformio]
default_envs = esp32dev
core_dir = .pio/core

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
extra_scripts = post:verify_framework.py
platform_packages =
    framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/e010351b2cafe3a872f18878cb2d3e08f167c650.zip
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wl,--wrap=esp_bt_controller_init

